name: CI

# La revisión la hace la máquina: lint + tests + build en cada PR, y empaquetado
# real en Windows (donde el launcher existe de verdad).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # el binario de Electron no hace falta para construir la UI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (el presupuesto de avisos no sube)
        run: npm run lint

      - name: Tests de core
        run: npm run test

      - name: Versión de la landing
        run: npm run test:docs

      - name: Build de la UI
        run: npm run build

      - name: Auditoría de dependencias de ejecución
        # high/critical = rojo; los moderados salen en el log para tratarlos
        run: npm audit --omit=dev --audit-level=high

  package:
    name: empaquetar (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir y empaquetar (--dir + brand-exe + app-update.yml)
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --dir
          node scripts/brand-exe.js
          node scripts/app-update-yml.js

      - name: Smoke test (el exe arranca y trae el feed del updater)
        shell: pwsh
        run: |
          # Hasta ahora este job comprobaba que el build NO estuviera roto, no que
          # el launcher FUNCIONARA. Estas dos cosas son justamente las que se
          # rompen en silencio: sin app-update.yml el updater revienta con ENOENT
          # en runtime (justo lo que avisa scripts/app-update-yml.js), y un exe que
          # muere al arrancar solo se ve probandolo.
          $yml = 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $yml)) {
            throw "falta $yml -> el auto-updater fallara con ENOENT en runtime"
          }
          Write-Host '  app-update.yml:'
          Get-Content $yml | ForEach-Object { Write-Host "    $_" }

          $exe = 'release/win-unpacked/FerroLauncher.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--no-sandbox' -PassThru -ErrorAction Stop
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "FerroLauncher.exe muere al arrancar (codigo $($p.ExitCode))"
          }
          Write-Host "  FerroLauncher.exe sigue vivo tras 15 s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Subir el exe como artefacto (aún sin firmar, solo para probar)
        uses: actions/upload-artifact@v7
        with:
          name: FerroLauncher-win-unpacked
          path: release/win-unpacked/FerroLauncher.exe
          if-no-files-found: error
          retention-days: 7
