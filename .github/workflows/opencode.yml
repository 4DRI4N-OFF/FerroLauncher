name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    # Gate de autorización: el repo es público, así que sin esto CUALQUIER
    # visitante puede escribir "/oc" en un comentario y disparar una corrida
    # con ANTHROPIC_API_KEY expuesta en env. Solo quien ya colabora aquí.
    if: |
      github.event.comment.author_association in ('OWNER', 'MEMBER', 'COLLABORATOR') &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    # El agente no llama a la API de GitHub: sin tokens. (antes pedía id-token
    # para nada y de paso abría la puerta a OIDC injection)
    permissions: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        # Fijado al commit que hoy resuelve el tag `latest` de la action
        # (2c14fc5 -> 77fc88c). Con @latest, quien controla ese repo decide
        # qué corre aquí con tu API key; con un SHA hace falta un PR.
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514