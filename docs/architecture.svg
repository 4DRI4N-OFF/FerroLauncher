<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#ffb62e"/>
      <stop offset="1" stop-color="#e23a1a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="860" height="420" rx="20" fill="#0d0908"/>
  <text x="30" y="42" fill="#ffe27a" font-size="22" font-weight="800">FerroLauncher — how it works</text>

  <!-- UI -->
  <g filter="url(#soft)">
    <rect x="30" y="70" width="200" height="110" rx="16" fill="#18100c" stroke="#ffb62e" stroke-width="1.5"/>
    <text x="130" y="102" fill="#f6f1e8" font-size="15" font-weight="700" text-anchor="middle">React UI</text>
    <text x="130" y="126" fill="#a89c88" font-size="12" text-anchor="middle">glass theme · ES/EN</text>
    <text x="130" y="146" fill="#a89c88" font-size="12" text-anchor="middle">toasts · sounds · splash</text>
  </g>

  <!-- Preload/IPC -->
  <g filter="url(#soft)">
    <rect x="330" y="70" width="200" height="110" rx="16" fill="#18100c" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="430" y="102" fill="#f6f1e8" font-size="15" font-weight="700" text-anchor="middle">preload · IPC</text>
    <text x="430" y="126" fill="#a89c88" font-size="12" text-anchor="middle">contextBridge</text>
    <text x="430" y="146" fill="#a89c88" font-size="12" text-anchor="middle">40+ channels</text>
  </g>

  <!-- Core -->
  <g filter="url(#soft)">
    <rect x="250" y="230" width="360" height="110" rx="16" fill="#18100c" stroke="url(#ember)" stroke-width="2"/>
    <text x="430" y="262" fill="#f6f1e8" font-size="15" font-weight="700" text-anchor="middle">core/ engine (Node)</text>
    <text x="430" y="286" fill="#a89c88" font-size="12" text-anchor="middle">versions · natives · assets · instances</text>
    <text x="430" y="306" fill="#a89c88" font-size="12" text-anchor="middle">java · mods · auth · backups</text>
  </g>

  <!-- arrows -->
  <g stroke="#ffb62e" stroke-width="2" fill="none" opacity="0.8">
    <line x1="230" y1="125" x2="330" y2="125" marker-end="none"/>
    <line x1="380" y1="180" x2="380" y2="230"/>
    <line x1="480" y1="180" x2="480" y2="230"/>
  </g>
  <polygon points="330,118 342,125 330,132" fill="#ffb62e" opacity="0.8"/>
  <polygon points="373,230 380,242 387,230" fill="#ffb62e" opacity="0.8"/>
  <polygon points="473,230 480,242 487,230" fill="#ffb62e" opacity="0.8"/>

  <!-- APIs -->
  <g font-size="12">
    <rect x="30" y="360" width="120" height="34" rx="17" fill="#12240f" stroke="#4ade80"/>
    <text x="90" y="382" fill="#d9f9c1" text-anchor="middle">Mojang API</text>
    <rect x="165" y="360" width="120" height="34" rx="17" fill="#12240f" stroke="#4ade80"/>
    <text x="225" y="382" fill="#d9f9c1" text-anchor="middle">Modrinth</text>
    <rect x="300" y="360" width="150" height="34" rx="17" fill="#241a08" stroke="#ffb62e"/>
    <text x="375" y="382" fill="#ffe1a8" text-anchor="middle">Fabric · Forge · Quilt</text>
    <rect x="465" y="360" width="130" height="34" rx="17" fill="#0a1420" stroke="#5eb1ff"/>
    <text x="530" y="382" fill="#cfe8ff" text-anchor="middle">Xbox · Mojang</text>
    <rect x="610" y="360" width="220" height="34" rx="17" fill="#1c0f0a" stroke="#f87171"/>
    <text x="720" y="382" fill="#fecaca" text-anchor="middle">Temurin · GitHub updater</text>
  </g>
  <line x1="430" y1="340" x2="430" y2="360" stroke="#ffb62e" stroke-width="2" opacity="0.8"/>
</svg>
