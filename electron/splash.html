<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; }
  .wrap {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; color: #f6f1e8;
    background: radial-gradient(420px 260px at 50% 30%, rgba(255,110,40,.25), transparent 70%),
      rgba(13, 9, 8, 0.92);
    border: 1px solid rgba(255,255,255,.1); border-radius: 24px;
  }
  img.logo {
    width: 300px; aspect-ratio: 2030 / 701; height: auto; display: block;
    border-radius: 18px;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 26px rgba(255,140,30,.35)) brightness(1); }
    50% { transform: scale(1.045); filter: drop-shadow(0 16px 44px rgba(255,110,25,.65)) brightness(1.12); }
  }
  .bar { width: 240px; height: 8px; border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
    background: linear-gradient(90deg, #ffe27a, #ffb62e, #e23a1a);
    animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .t { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(243,232,214,.6); }
  .sembers { position: absolute; inset: 0; overflow: hidden; border-radius: 24px; pointer-events: none; }
  .sembers i { position: absolute; bottom: -12px; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,90,.9), transparent 70%); animation: srise 3.2s ease-in infinite; }
  .sembers i:nth-child(1) { left: 12%; width: 7px; height: 7px; animation-delay: 0s; }
  .sembers i:nth-child(2) { left: 25%; width: 5px; height: 5px; animation-delay: .7s; }
  .sembers i:nth-child(3) { left: 38%; width: 9px; height: 9px; animation-delay: 1.4s; }
  .sembers i:nth-child(4) { left: 52%; width: 6px; height: 6px; animation-delay: .4s; }
  .sembers i:nth-child(5) { left: 64%; width: 8px; height: 8px; animation-delay: 2s; }
  .sembers i:nth-child(6) { left: 76%; width: 5px; height: 5px; animation-delay: 1.1s; }
  .sembers i:nth-child(7) { left: 86%; width: 7px; height: 7px; animation-delay: 2.6s; }
  .sembers i:nth-child(8) { left: 45%; width: 4px; height: 4px; animation-delay: 1.8s; }
  @keyframes srise { to { transform: translateY(-460px); opacity: 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sembers"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <img class="logo" src="../build/brand.png" alt="FerroLauncher" />
    <div class="bar"><i></i></div>
    <div class="t">Cargando</div>
  </div>
</body>
</html>
