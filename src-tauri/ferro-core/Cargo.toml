[package]
name = "ferro-core"
version = "0.9.6"
edition = "2021"
description = "Motor de FerroLauncher (sin dependencia de Tauri, se prueba solo)"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.30", default-features = false }
opener = "0.7"
trash = "5"

[dev-dependencies]
tempfile = "3"
